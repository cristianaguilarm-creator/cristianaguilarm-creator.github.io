<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos!</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .tarjeta-contacto {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 90%;
        }

        h1 { margin-bottom: 20px; }

        .email-link {
            display: block;
            background: white;
            color: #764ba2;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .email-link:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 25px;
            color: white;
            text-decoration: underline;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .btn-volver:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="tarjeta-contacto">
        <h1>📬 Contacto</h1>
        <p>Puedes escribirme a mis correos oficiales:</p>

        <!-- Enlaces tipo "mailto" que abren el correo directamente -->
        <a href="mailto:cristian.aguilarm@colegiolosprincipes.cl" class="email-link">
            📧 Institucional
        </a>

        <a href="mailto:cristian.jhon.aguilar35a@gmail.com" class="email-link">
            📧 Personal
        </a>

        <br>
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </div>

</body>
</html>
