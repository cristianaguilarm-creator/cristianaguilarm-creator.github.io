<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Criss Creator</title>
    <style>
        :root {
            --bg-gradiente: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-tarjeta: rgba(255, 255, 255, 0.15);
        }

        .dark-mode {
            --bg-gradiente: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-tarjeta: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradiente);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            transition: 0.5s;
        }

        .tarjeta-contacto {
            background-color: var(--bg-tarjeta);
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            /* Animación de entrada */
            animation: aparecer 0.6s ease-out;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { margin-bottom: 5px; font-size: 2.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .subtitulo { margin-bottom: 30px; opacity: 0.8; font-size: 1rem; }

        .red-social {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .red-social:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            filter: brightness(1.2);
        }

        .discord { background-color: #5865F2; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .github { background-color: #24292e; }

        .btn-volver {
            display: inline-block;
            margin-top: 25px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }

        .btn-volver:hover { background: white; color: #764ba2; }

        /* Botón de Modo Oscuro */
        .btn-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }
        .btn-toggle:hover { background: white; transform: rotate(30deg); }
    </style>
</head>
<body>

    <button class="btn-toggle" onclick="toggleDarkMode()">🌓</button>

    <div class="tarjeta-contacto">
        <h1>👋 Criss Creator</h1>
        <p class="subtitulo">¡Hablemos de programación y mates!</p>

        <a href="https://discord.gg/d2R6a2kRSN" target="_blank" class="red-social discord">
            🎮 Grupo de Discord
        </a>

        <a href="https://www.instagram.com/criss.creator/" target="_blank" class="red-social instagram">
            📸 Instagram: @criss.creator
        </a>

        <a href="https://github.com/Cristianaguilarm-creator" target="_blank" class="red-social github">
            💻 GitHub Profile
        </a>

        <a href="index.html" class="btn-volver">🏠 Volver al inicio</a>
    </div>

    <script src="js/modo-oscuro.js"></script>
</body>
</html>
