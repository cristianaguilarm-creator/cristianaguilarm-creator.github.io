<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Contacta a Criss Creator!</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            padding: 20px;
        }

        .tarjeta-contacto {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 { margin-bottom: 5px; font-size: 2rem; }
        .subtitulo { margin-bottom: 25px; opacity: 0.8; font-size: 0.9rem; }

        .red-social {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: transform 0.3s, filter 0.3s;
        }

        .red-social:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        /* Colores de las marcas */
        .discord { background-color: #5865F2; }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .github { background-color: #24292e; }
        .email { background-color: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); }

        .btn-volver {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
        }

        .btn-volver:hover { background: rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div class="tarjeta-contacto">
        <h1>👋 Criss Creator</h1>
        <p class="subtitulo">¡Conéctate conmigo en mis redes!</p>

        <!-- Discord (No es link directo a menos que sea un server, pero mostramos el user) -->
        <a href="https://discord.gg/d2R6a2kRSN" target="_blank" class="red-social discord">
            🎮 Discord group: cristian099365
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/criss.creator/" target="_blank" class="red-social instagram">
            📸 Instagram: @criss.creator
        </a>

        <!-- GitHub -->
        <a href="https://github.com" target="_blank" class="red-social github">
            💻 GitHub: cristianaguilarm-creator
        </a>

        <a href="index.html" class="btn-volver">🏠 Volver al inicio</a>
    </div>

</body>
</html>
