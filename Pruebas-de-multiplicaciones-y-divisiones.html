<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío 500 Puntos: Multi y Divi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; transition: 0.5s;
        }
        .dark-mode { background: #0f172a !important; }

        /* Botones Esquinas */
        .btn-esquina {
            position: fixed; top: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            color: white; text-decoration: none; border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px); transition: 0.3s;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-esquina:hover { background: white; color: #1e3c72; transform: scale(1.05); }
        .btn-izquierdo { left: 20px; padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; }
        .btn-derecho { right: 20px; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border:none; font-size: 18px; }

        /* Tarjeta */
        .card { 
            background: white; padding: 2rem; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 350px; text-align: center;
        }
        .dark-mode .card { background: #1e293b; color: white; border: 1px solid #334155; }

        .pregunta-box {
            background: #f1f5f9; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; border: 1px solid #e2e8f0;
        }
        .dark-mode .pregunta-box { background: #334155; border: none; }

        input {
            width: 70%; padding: 10px; margin: 10px 0;
            border-radius: 8px; border: 2px solid #ddd; text-align: center; font-size: 1.1rem;
        }
        button.accion { 
            width: 100%; padding: 10px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        .btn-multi { background: #3b82f6; } /* Azul */
        .btn-divi { background: #f59e0b; }  /* Naranja */

        /* Barra */
        .progreso-container { margin-bottom: 20px; }
        .barra-fondo { background: #e2e8f0; border-radius: 10px; height: 12px; overflow: hidden; }
        .barra-relleno { background: #10b981; width: 0%; height: 100%; transition: 0.5s; }
    </style>
</head>
<body>

    <a href="pruebas.html" class="btn-esquina btn-izquierdo">⬅ Pruebas</a>
    <button class="btn-esquina btn-derecho" onclick="document.body.classList.toggle('dark-mode')">🌓</button>

    <div class="card">
        <div class="progreso-container">
            <div style="margin-bottom: 8px; font-weight: bold;">Puntos Pro: <span id="puntos">0</span> / 100</div>
            <div class="barra-fondo"><div id="barra" class="barra-relleno"></div></div>
        </div>

        <div class="pregunta-box">
            <h3 id="txt_multi">Cargando...</h3>
            <input type="number" id="in_multi" placeholder="?">
            <button class="accion btn-multi" onclick="validar('multi')">Verificar (+5 pts)</button>
        </div>

        <div class="pregunta-box">
            <h3 id="txt_divi">Cargando...</h3>
            <input type="number" id="in_divi" placeholder="?">
            <button class="accion btn-divi" onclick="validar('divi')">Verificar (+10 pts)</button>
        </div>
    </div>

    <script>
        let puntosTotales = parseInt(localStorage.getItem('puntosPro')) || 0;
        let respuestas = { multi: 0, divi: 0 };

        function generar() {
            // Multiplicación (Tablas del 2 al 12)
            let m1 = Math.floor(Math.random() * 11) + 2;
            let m2 = Math.floor(Math.random() * 11) + 2;
            respuestas.multi = m1 * m2;
            document.getElementById('txt_multi').innerText = `${m1} x ${m2}`;

            // División Exacta (Invertimos una multiplicación para que siempre dé exacto)
            let d2 = Math.floor(Math.random() * 9) + 2; // Divisor
            let resDiv = Math.floor(Math.random() * 9) + 2; // Resultado esperado
            let d1 = d2 * resDiv; // Dividendo
            respuestas.divi = resDiv;
            document.getElementById('txt_divi').innerText = `${d1} ÷ ${d2}`;
        }

        function validar(tipo) {
            const input = document.getElementById('in_' + tipo);
            const pts = (tipo === 'multi') ? 5 : 10;

            if (parseInt(input.value) === respuestas[tipo]) {
                puntosTotales += pts;
                localStorage.setItem('puntosPro', puntosTotales);
                input.value = "";
                actualizar();
                generar();
            } else {
                alert("¡Casi! Revisa la cuenta. ❌");
            }
        }

        function actualizar() {
            document.getElementById('puntos').innerText = puntosTotales;
            document.getElementById('barra').style.width = Math.min(puntosTotales, 100) + "%";
            if (puntosTotales >= 500) {
                alert("¡MAESTRO MATEMÁTICO! 🏆 Lograste los 100 puntos.");
                puntosTotales = 0;
                localStorage.removeItem('puntosPro');
                actualizar();
            }
        }

        window.onload = () => { generar(); actualizar(); };
    </script>
</body>
</html>
