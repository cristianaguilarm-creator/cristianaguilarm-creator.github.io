<!DOCTYPE html>
<html>
<head>
    <title>Resolución de Matemáticas!</title>
</head>
<body>
    <h1>Calculadora Interactiva</h1>
    
    <!-- Inputs con ID para identificarlos -->
    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    
    <br><br>
    
    <!-- Botones que activan las funciones -->
    <button onclick="sumar()">Sumar</button>
    <button onclick="restar()">Restar</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>

    <h2 id="resultado">Resultado: </h2>

    <!-- Aquí va el código de programación (JavaScript) -->
    <script>
        function sumar() {
            // Obtenemos los valores y los convertimos a números
            let a = parseFloat(document.getElementById('num1').value);
            let b = parseFloat(document.getElementById('num2').value);
            document.getElementById('resultado').innerText = "Resultado: " + (a + b);
        }

        function restar() {
            let a = parseFloat(document.getElementById('num1').value);
            let b = parseFloat(document.getElementById('num2').value);
            document.getElementById('resultado').innerText = "Resultado: " + (a - b);
        }

        function multiplicar() {
            let a = parseFloat(document.getElementById('num1').value);
            let b = parseFloat(document.getElementById('num2').value);
            document.getElementById('resultado').innerText = "Resultado: " + (a * b);
        }

        function dividir() {
            let a = parseFloat(document.getElementById('num1').value);
            let b = parseFloat(document.getElementById('num2').value);
            if (b === 0) {
                alert("¡No se puede dividir por cero!");
            } else {
                document.getElementById('resultado').innerText = "Resultado: " + (a / b);
            }
        }
    </script>
</body>
</html>
