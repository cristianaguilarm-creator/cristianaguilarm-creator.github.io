<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Súper Calculadora</title>
    <style>
        /* --- ESTILOS (El "maquillaje" de tu web) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .btn-inicio {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background-color: rgba(255, 255, 255, 0.2); /* Color semi-transparente */
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    transition: all 0.3s;
}

.btn-inicio:hover {
    background-color: white;
    color: #764ba2; /* Cambia al color de tu fondo */
    transform: scale(1.05);
}

        .contenedor {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        h1 {
            color: #4a4a4a;
            margin-bottom: 20px;
            font-size: 24px;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #764ba2;
        }

        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #764ba2;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #5a377d;
            transform: translateY(-2px);
        }

        button.limpiar {
            background-color: #ff4757;
            grid-column: span 2; /* Ocupa las dos columnas */
            margin-top: 5px;
        }

        button.limpiar:hover {
            background-color: #ff1f33;
        }

        #resultado-caja {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
        }

        #resultado {
            font-size: 20px;
            font-weight: bold;
            color: #2f3542;
            margin: 0;
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn-inicio">🏠 Ir a Inicio</a>

    <div class="contenedor">
        <h1>🔢 Mi Calculadora</h1>
        
        <input type="number" id="num1" placeholder="Primer número">
        <input type="number" id="num2" placeholder="Segundo número">
        
        <div class="botones">
            <button onclick="operar('+')">Sumar</button>
            <button onclick="operar('-')">Restar</button>
            <button onclick="operar('*')">Multiplicar</button>
            <button onclick="operar('/')">Dividir</button>
            <button class="limpiar" onclick="limpiar()">Limpiar pantalla</button>
        </div>

        <div id="resultado-caja">
            <p id="resultado">Resultado: -</p>
        </div>
    </div>

    <!-- --- LÓGICA (El "cerebro" de tu web) --- -->
    <script>
        function operar(operacion) {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const display = document.getElementById('resultado');

            // Validar que se hayan escrito números
            if (isNaN(n1) || isNaN(n2)) {
                display.innerText = "⚠️ Escribe números";
                return;
            }

            let res;
            switch(operacion) {
                case '+': res = n1 + n2; break;
                case '-': res = n1 - n2; break;
                case '*': res = n1 * n2; break;
                case '/': 
                    res = n2 !== 0 ? (n1 / n2).toFixed(2) : "❌ Error (div 0)"; 
                    break;
            }

            display.innerText = "Resultado: " + res;
        }

        function limpiar() {
            document.getElementById('num1').value = "";
            document.getElementById('num2').value = "";
            document.getElementById('resultado').innerText = "Resultado: -";
        }
    </script>

</body>
</html>
