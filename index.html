<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de aprendizaje de matemáticas!</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            text-align: center;
        }

    .dark-mode {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important;
    }
    .dark-mode .bienvenida {
        background-color: rgba(0, 0, 0, 0.4);
    }

        .bienvenida {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* --- CONTENEDOR DE LOS BOTONES --- */
        .botonera {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Separa los botones entre sí */
        }

        .boton-menu {
            display: block;
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        /* Efecto al pasar el mouse por encima */
        .boton-menu:hover {
            transform: translateY(-3px);
            background-color: white;
            color: #764ba2;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        /* Estilo especial para el botón principal */
        .boton-principal {
            background-color: #00d2ff;
            border: none;
        }

        .boton-principal:hover {
            background-color: #00bcff;
            color: white;
        }
    </style>
</head>
<body>
    
<button class="btn-toggle" onclick="toggleDarkMode()" style="position: fixed; top: 20px; right: 20px; cursor: pointer; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; padding: 10px; font-size: 20px;">🌓</button>

    <div class="bienvenida">
        <h1>¡Hola, desconocidos! 👋</h1>
        <p>¿A qué sección de la web te gustaría ir hoy?</p>
        
        <!-- Aquí están los botones para las distintas partes de tu página -->
        <div class="botonera">
            <a href="calculadora.html" class="boton-menu boton-principal">
                🧮 Ir a la Calculadora
            </a>
            
            <a href="teoria.html" class="boton-menu">
                📚 Aprender Matemáticas
            </a>
            
            <a href="contacto.html" class="boton-menu">
                📬 Contacto
            </a>
        </div>
    </div>
<!-- Añade esto antes del </body> -->
<script>
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }
</script>
</body>
</html>
