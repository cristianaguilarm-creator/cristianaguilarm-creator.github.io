<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de aprendizaje de matemáticas!</title>
       <style>
        /* 1. CAPA DE PARTÍCULAS (Agregada al inicio) */
        #particles-js {
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
            pointer-events: none !important;
        }
        .bienvenida, #theme-icon, #btnVolver { 
            position: relative !important; 
            z-index: 5 !important; 
        }

        /* 2. Definimos las variables para el modo claro (Azul Tecnológico) */
        :root {
            --bg-gradiente: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --bg-bienvenida: rgba(255, 255, 255, 0.02);
        }

        /* 3. Variables alternativas cuando se activa el modo oscuro (Espacial Morado) */
        body.dark-mode {
            --bg-gradiente: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-bienvenida: rgba(15, 23, 42, 0.15);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradiente) !important; /* Usa la variable de fondo */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            text-align: center;
            /* Transición suave para el cambio de fondo gradual */
            transition: background 0.5s ease-in-out;
            overflow: hidden;
        }

                /* CORRECCIÓN: Tarjeta ultra transparente estilo cristal */
        .bienvenida {
            /* Fondo plano casi invisible (3% de blanco) para ver pasar las partículas */
            background: rgba(255, 255, 255, 0.03) !important; 
            padding: 40px;
            border-radius: 24px; 
            backdrop-filter: blur(12px) !important; /* Desenfoque sutil estilo cristal */
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 45px rgba(2, 132, 199, 0.15);
            transition: background-color 0.5s ease-in-out;
        }
        
        /* CORRECCIÓN: Transparencia oscura adaptada para cuando activas el modo noche */
        body.dark-mode .bienvenida {
            background: rgba(15, 23, 42, 0.15) !important; 
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }


        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.95;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* --- CONTENEDOR DE LOS BOTONES --- */
        .botonera {
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }

        .boton-menu {
            display: block;
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.06) !important;
            color: white !important;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        /* Efecto al pasar el mouse por encima */
        .boton-menu:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .boton-juego {
            background: #ff9f43 !important; 
            border: none !important;
        }

        .boton-juego:hover {
            background: #ff7f11 !important;
            transform: scale(1.1) rotate(2deg); 
        }

        /* Estilo especial para el botón principal */
        .boton-principal {
            background: linear-gradient(135deg, #00d2ff 0%, #00bcff 100%) !important;
            border: none !important;
            box-shadow: 0 6px 15px rgba(0, 210, 255, 0.25);
        }

        .boton-principal:hover {
            background: linear-gradient(135deg, #00bcff 0%, #00a0ff 100%) !important;
            color: white !important;
            box-shadow: 0 12px 25px rgba(0, 210, 255, 0.4);
        }

        /* Este efecto de giro SOLO se activará en computadoras con mouse */
        @media (hover: hover) {
            .btn-toggle:hover {
                background: white !important;
                transform: scale(1.1) rotate(30deg);
            }
        }

        /* Para teléfonos: un efecto de pulsación rápido y sutil al tocarlo */
        .btn-toggle:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4) !important;
        }

        /* ESTILOS DEL BOTÓN VOLVER */
        .boton-volver-estilo {
            display: none; 
            background-color: rgba(255, 255, 255, 0.1) !important; 
            color: white !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px; 
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px; 
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(5px);
        }
                
        .boton-volver-estilo:hover {
            background-color: white !important;
            color: #0284c7 !important; 
            transform: scale(1.05); 
        }
    </style>

</head>
<body>
    <div id="particles-js"></div>
    <!-- Botón flotante para activar el modo oscuro -->
    <button id="theme-icon" class="btn-toggle" onclick="toggleDarkMode()" style="position: fixed; top: 20px; right: 20px; cursor: pointer; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; padding: 12px; font-size: 20px; transition: 0.3s;">🌓</button>

    <div class="bienvenida">
        <!-- El botón ahora está integrado aquí dentro para mantener la alineación limpia -->
        <button id="btnVolver" class="boton-volver-estilo" onclick="window.history.back()">
            ⬅️ Volver
        </button>

        <h1>¡Hola, desconocidos! 👋</h1>
        <p>¿A qué sección de la web te gustaría ir hoy?</p>
        
        <!-- Aquí están los botones para las distintas partes de tu página -->
        <div class="botonera">
            <a href="calculadora" class="boton-menu boton-principal">
                🧮 Ir a la Calculadora
            </a>
            
            <a href="teoria" class="boton-menu">
                📚 Aprender Matemáticas
            </a>

            <a href="pruebas" class="boton-menu">
                 🏆 Pruebas de matemáticas 
            </a>
            <a href="juegos" class="boton-menu boton-juego">
                🎮 Zona de Juegos
            </a>
            <a href="reglas" class="boton-menu">
                🚨 Reglas
            </a>

            <a href="contacto" class="boton-menu">
                📬 Contacto
            </a>
        </div>
    </div>

    <!-- Vinculación al archivo dentro de la carpeta js -->
    <script src="js/modo-oscuro.js"></script>
        <!-- 1. Enlace a tu librería local que ya pesa 22.8 kB con éxito -->
    <script src="js/particles.min.js"></script>
    <script>
        // 2. Configuración de la red de partículas de alta visibilidad
        function cargarParticulas(colorParticula) {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 65, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": colorParticula },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.7, "random": false },
                    "size": { "value": 4.5, "random": true },
                    "line_linked": { 
                        "enable": true, 
                        "distance": 140, 
                        "color": colorParticula, 
                        "opacity": 0.4, 
                        "width": 1.5 
                    },
                    "move": { "enable": true, "speed": 2.2, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
                }
            });
        }

        // 3. Activación inmediata en color blanco para que contrasten genial
        cargarParticulas("#ffffff");

        // 4. Sincronización automática con tu botón de la luna/sol
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('theme-icon')?.addEventListener('click', () => {
                setTimeout(() => cargarParticulas("#ffffff"), 50);
            });
        });
    </script>


    <!-- Lógica de detección -->
    <script>
      const origenReal = document.referrer.toLowerCase();

      if (origenReal.includes("cristian2024-ops.github.io")) {
        document.getElementById("btnVolver").style.display = "block";
      }
    </script>
</body>
</html>
