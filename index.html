<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de aprendizaje de matemáticas!</title>
    <style>
        /* 1. Definimos las variables para el modo claro */
        :root {
            --bg-gradiente: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-bienvenida: rgba(255, 255, 255, 0.1);
        }

        /* 2. Variables alternativas cuando se activa el modo oscuro */
        .dark-mode {
            --bg-gradiente: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-bienvenida: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradiente); /* Usa la variable de fondo */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            text-align: center;
            /* Transición suave para el cambio de fondo gradual */
            transition: background 0.5s ease-in-out;
        }

        .bienvenida {
            background-color: var(--bg-bienvenida); /* Usa la variable de la tarjeta */
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            /* Transición suave para el cambio de la tarjeta */
            transition: background-color 0.5s ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* --- CONTENEDOR DE LOS BOTONES --- */
        .botonera {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Separa los botones entre sí */
        }

        .boton-menu {
            display: block;
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        /* Efecto al pasar el mouse por encima */
        .boton-menu:hover {
            transform: translateY(-3px);
            background-color: white;
            color: #764ba2;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .boton-juego {
            background-color: #ff9f43 !important; /* Naranja llamativo */
            border: none !important;
        }

        .boton-juego:hover {
            background-color: #ff7f11 !important;
            transform: scale(1.1) rotate(2deg); /* Un pequeño giro para que se vea divertido */
        }

        /* Estilo especial para el botón principal */
        .boton-principal {
            background-color: #00d2ff;
            border: none;
        }

        .boton-principal:hover {
            background-color: #00bcff;
            color: white;
        }

        /* Este efecto de giro SOLO se activará en computadoras con mouse */
@media (hover: hover) {
    .btn-toggle:hover {
        background: white !important;
        transform: scale(1.1) rotate(30deg);
    }
}

/* Para teléfonos: un efecto de pulsación rápido y sutil al tocarlo */
.btn-toggle:active {
    transform: scale(0.95);
    background: rgba(255, 255, 255, 0.4) !important;
            }
    </style>
</head>
<body>
    <button id="btnVolver" style="display: none;" onclick="window.history.back()">
  Volver
    </button>

    
    <!-- Botón flotante para activar el modo oscuro (Le añadimos la id "theme-icon" para cambiar el emoji) -->
    <button id="theme-icon" class="btn-toggle" onclick="toggleDarkMode()" style="position: fixed; top: 20px; right: 20px; cursor: pointer; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; padding: 12px; font-size: 20px; transition: 0.3s;">🌓</button>

    <div class="bienvenida">
        <h1>¡Hola, desconocidos! 👋</h1>
        <p>¿A qué sección de la web te gustaría ir hoy?</p>
        
        <!-- Aquí están los botones para las distintas partes de tu página -->
        <div class="botonera">
            <a href="calculadora" class="boton-menu boton-principal">
                🧮 Ir a la Calculadora
            </a>
            
            <a href="teoria" class="boton-menu">
                📚 Aprender Matemáticas
            </a>

            <a href="pruebas" class="boton-menu">
                 🏆 Pruebas de matemáticas 
            </a>
            <a href="juegos" class="boton-menu boton-juego">
                🎮 Zona de Juegos
            </a>
            <a href="reglas" class="boton-menu">
                🚨 Reglas
            </a>

            <a href="contacto" class="boton-menu">
                📬 Contacto
            </a>
        </div>
    </div>

    <!-- Vinculación al archivo dentro de la carpeta js -->
    <script src="js/modo-oscuro.js"></script>
    <!-- El botón inicia oculto con display: none -->

<script>
  // Página :D
  const paginaOrigenEsperada = "https://cristian2024-ops.github.io/index.html";

  // Verificamos si el usuario viene de esa página específica
  if (document.referrer === paginaOrigenEsperada) {
    // Si coincide, mostramos el botón
    document.getElementById("btnVolver").style.display = "block";
  }
</script>

</body>
</html>
