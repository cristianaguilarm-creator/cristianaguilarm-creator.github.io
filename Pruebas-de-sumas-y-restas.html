<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas de sumas y restas</title>
    <style>
          .dark-mode {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important;
    }
    .dark-mode .card { /* Hola a quien este sapeando el código xd*/
        background-color: #1e1e1e;
        color: white;
    }
    .dark-mode h1 { color: #00d2ff; }
        /* --- ESTILOS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
      
      .btn-inicio {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background-color: rgba(255, 255, 255, 0.2); /* Color semi-transparente */
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    transition: all 0.3s;
}

.btn-inicio:hover {
    background-color: white;
    color: #764ba2; /* Cambia al color de tu fondo */
    transform: scale(1.05);
            }

        .card { 
          background: blue;
          padding: 2rem;
          border-radius: 8px;
          border: 1px solid #d0d7de;
          box-shadow: 0 8px 24px rgba(140, 149, 159, 0.1);
          width: 320px;
        }
      .sumas {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        border: 1px; 
      }
      .restas { 
        background: white;
        padding: 2rem;
        border-radius: 8px;
        border: 1px; 
      }
    </style>
  </head>
  <body>

    <button class="btn-toggle" onclick="toggleDarkMode()" style="position: fixed; top: 20px; right: 20px; cursor: pointer; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; padding: 10px; font-size: 20px;">🌓</button>
    
    <div class="card">
      <div class="sumas">
        <h3>¿Cuanto es 20+74?</h3>
        <input type="number" id="number1" placeholder="Responde aquí...">
      </div>
      <div class="restas">
        <h3>¿Cuanto es 46-23?</h3>
        <input type="number" id="number2" placeholder="Responde aquí...">
      </div>
    </div>
    <script>
      function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
      }
    </script>
  </body>
</html>
