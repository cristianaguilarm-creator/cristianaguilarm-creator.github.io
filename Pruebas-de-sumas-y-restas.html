<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas de sumas y restas</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; transition: 0.5s;
        }
        .dark-mode { background: #1a1a2e !important; }
        
        .card { 
            background: white; padding: 2rem; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 320px; text-align: center;
        }
        .dark-mode .card { background: #16213e; color: white; }

        .pregunta-contenedor { margin-bottom: 20px; }
        
        h2 { font-size: 2rem; margin: 10px 0; color: #764ba2; }
        .dark-mode h2 { color: #4ecca3; }

        input {
            width: 80%; padding: 12px; margin: 15px 0;
            border: 2px solid #ddd; border-radius: 10px;
            font-size: 1.2rem; text-align: center;
        }

        button {
            width: 100%; padding: 12px; border: none;
            border-radius: 10px; background: #764ba2;
            color: white; font-weight: bold; cursor: pointer;
            font-size: 1rem; transition: 0.3s;
        }
        button:hover { background: #5a3682; transform: scale(1.02); }

        .score { font-weight: bold; margin-top: 15px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <div class="pregunta-contenedor">
            <p id="tipo-operacion">Resuelve la suma:</p>
            <h2 id="ejercicio">0 + 0</h2>
            <input type="number" id="respuesta" placeholder="?" autofocus>
            <button onclick="comprobar()">¡Verificar!</button>
        </div>
        <div class="score">Puntos: <span id="puntos">0</span></div>
    </div>

    <script>
        let resultadoCorrecto;
        let puntos = 0;

        // Función para crear una nueva operación aleatoria
        function nuevaOperacion() {
            const num1 = Math.floor(Math.random() * 50) + 1; // Número del 1 al 50
            const num2 = Math.floor(Math.random() * 50) + 1;
            const esSuma = Math.random() > 0.5; // Elige azar entre suma o resta

            if (esSuma) {
                resultadoCorrecto = num1 + num2;
                document.getElementById('ejercicio').innerText = `${num1} + ${num2}`;
                document.getElementById('tipo-operacion').innerText = "Resuelve la suma:";
            } else {
                // Para que la resta no dé negativo, ponemos el mayor primero
                const mayor = Math.max(num1, num2);
                const menor = Math.min(num1, num2);
                resultadoCorrecto = mayor - menor;
                document.getElementById('ejercicio').innerText = `${mayor} - ${menor}`;
                document.getElementById('tipo-operacion').innerText = "Resuelve la resta:";
            }
            
            document.getElementById('respuesta').value = ""; // Limpiar input
            document.getElementById('respuesta').focus();    // Poner el cursor listo
        }

        function comprobar() {
            const respuestaUsuario = parseInt(document.getElementById('respuesta').value);
            
            if (respuestaUsuario === resultadoCorrecto) {
                puntos++;
                document.getElementById('puntos').innerText = puntos;
                alert("¡Genial! +1 punto");
                nuevaOperacion(); // Carga otra pregunta automáticamente
            } else {
                alert("Ups, intenta esa de nuevo");
            }
        }

        // Iniciar el primer ejercicio al cargar la página
        nuevaOperacion();
    </script>
</body>
</html>
