<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Desafío 100 Puntos: Sumas y Restas</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; transition: 0.5s;
        }
        .dark-mode { background: #1a1a2e !important; }
        .card { 
            background: white; padding: 2rem; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 350px; text-align: center;
        }
        .dark-mode .card { background: #16213e; color: white; }
        .pregunta-box {
            background: #f8f9fa; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; border: 1px solid #eee;
        }
        .dark-mode .pregunta-box { background: #0f3460; border: none; }
        input {
            width: 70%; padding: 10px; margin: 10px 0;
            border-radius: 8px; border: 2px solid #ddd; text-align: center;
        }
        button {
            width: 100%; padding: 10px; border: none; border-radius: 8px;
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-suma { background: #28a745; }
        .btn-resta { background: #dc3545; }
        .btn-toggle { position: fixed; top: 20px; right: 20px; cursor: pointer; }
        
        /* Barra de progreso */
        .progreso-container { margin-bottom: 20px; }
        .barra-fondo { background: #eee; border-radius: 10px; height: 12px; }
        .barra-relleno { 
            background: #ffc107; width: 0%; height: 100%; 
            border-radius: 10px; transition: 0.5s; 
        }
    </style>
</head>
<body>

    <!-- Botón Izquierdo: Ir a Pruebas -->
<a href="Pruebas.html" class="btn-esquina btn-izquierdo">⬅ Pruebas</a>

<!-- Botón Derecho: Modo Oscuro -->
<button class="btn-esquina btn-derecho" onclick="toggleDarkMode()">🌓</button>
    

    <button class="btn-toggle" onclick="document.body.classList.toggle('dark-mode')">🌓</button>

    <div class="card">
        <div class="progreso-container">
            <div style="margin-bottom: 5px;">Puntos: <span id="puntos">0</span> / 100</div>
            <div class="barra-fondo">
                <div id="barra" class="barra-relleno"></div>
            </div>
        </div>

        <div class="pregunta-box">
            <h3 id="txt_suma">Cargando suma...</h3>
            <input type="number" id="in_suma" placeholder="?">
            <button class="btn-suma" onclick="validar('suma')">Verificar (+3 pts)</button>
        </div>

        <div class="pregunta-box">
            <h3 id="txt_resta">Cargando resta...</h3>
            <input type="number" id="in_resta" placeholder="?">
            <button class="btn-resta" onclick="validar('resta')">Verificar (+7 pts)</button>
        </div>
    </div>

    <script>
        let puntosTotales = 0;
        let respuestas = { suma: 0, resta: 0 };

        function generar() {
            // Suma (Números del 1 al 100)
            let s1 = Math.floor(Math.random() * 100) + 1;
            let s2 = Math.floor(Math.random() * 100) + 1;
            respuestas.suma = s1 + s2;
            document.getElementById('txt_suma').innerText = `${s1} + ${s2}`;

            // Resta (Aseguramos que el resultado sea positivo)
            let r1 = Math.floor(Math.random() * 100) + 50;
            let r2 = Math.floor(Math.random() * 50) + 1;
            respuestas.resta = r1 - r2;
            document.getElementById('txt_resta').innerText = `${r1} - ${r2}`;
        }

        function validar(tipo) {
            const input = document.getElementById('in_' + tipo);
            const ptsGanados = (tipo === 'suma') ? 3 : 7;

            if (parseInt(input.value) === respuestas[tipo]) {
                puntosTotales += ptsGanados;
                input.value = "";
                actualizar();
                generar();
            } else {
                alert("¡Incorrecto! Intenta de nuevo.");
            }
        }

        function actualizar() {
            document.getElementById('puntos').innerText = puntosTotales;
            let porcentaje = Math.min(puntosTotales, 100);
            document.getElementById('barra').style.width = porcentaje + "%";

            if (puntosTotales >= 100) {
                alert("¡LO LOGRASTE! 🎉 Objetivo de 100 puntos alcanzado.");
                puntosTotales = 0;
                actualizar();
            }
        }

        window.onload = generar;
    </script>
</body>
</html>
