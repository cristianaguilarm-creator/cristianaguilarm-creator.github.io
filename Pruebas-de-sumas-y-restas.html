<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas de sumas y restas</title>
    <style>
          .dark-mode {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important;
    }
    .dark-mode .contenedor { /* Hola a quien este sapeando el código xd*/
        background-color: #1e1e1e;
        color: white;
    }
    .dark-mode h1 { color: #00d2ff; }
        /* --- ESTILOS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card { 
          background: blue;
          padding: 2rem;
          border-radius: 8px;
          border: 1px solid #d0d7de;
          box-shadow: 0 8px 24px rgba(140, 149, 159, 0.1);
          width: 320px;
        }
      .sumas {
        background: white;
        padding: 1rem;
        border-radius: 8px;
        border: 1px; 
      }
      .restas { 
        background: white;
        padding: 1rem;
        border-radius: 8px;
        border: 1px; 
      }
    </style>
  </head>
  <body>
    
    <div class="card">
      <div class="sumas">
        <h3>¿Cuanto es 20+74?</h3>
        <input type="number" id="number1" placeholder="Responde aquí...">
      </div>
      <div class="restas">
        <h3>¿Cuanto es 46-23?</h3>
        <input type="number" id="number2" placeholder="Responde aquí...">
      </div>
    </div>
  </body>
</html>
