<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pruebas de sumas y restas</title>
    <style>
        /* --- ESTILOS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: 0.5s;
        }

        .dark-mode {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important;
        }

        .card { 
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 350px;
        }

        .dark-mode .card { background-color: #1e1e1e; color: white; }

        .pregunta-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .btn-suma { background: #28a745; }
        .btn-suma:hover { background: #218838; transform: scale(1.05); }
        
        .btn-resta { background: #dc3545; }
        .btn-resta:hover { background: #c82333; transform: scale(1.05); }

        .btn-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <button class="btn-toggle" onclick="toggleDarkMode()">🌓</button>
    
    <div class="card">
        <div class="pregunta-box">
            <h3>¿Cuánto es 20 + 74?</h3>
            <input type="number" id="ans_suma" placeholder="Tu respuesta...">
            <button class="btn-suma" onclick="validar(1)">Validar Suma</button>
        </div>

        <div class="pregunta-box">
            <h3>¿Cuánto es 46 - 23?</h3>
            <input type="number" id="ans_resta" placeholder="Tu respuesta...">
            <button class="btn-resta" onclick="validar(2)">Validar Resta</button>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function validar(tipo) {
            if (tipo === 1) {
                const res = document.getElementById('ans_suma').value;
                if (parseInt(res) === 94) {
                    alert("¡Correcto! 🌟");
                } else {
                    alert("Sigue intentando... ❌");
                }
            } else {
                const res = document.getElementById('ans_resta').value;
                if (parseInt(res) === 23) {
                    alert("¡Excelente resta! 🎯");
                } else {
                    alert("Casi, pero no. Intenta otra vez. ❌");
                }
            }
        }
    </script>
</body>
</html>
