<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Matemáticos | Criss Creator</title>
    <style>
        :root {
            --bg-gradiente: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-card: rgba(255, 255, 255, 0.1);
            --texto: white;
            --accent: #00d2ff;
        }

        .dark-mode {
            --bg-gradiente: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-card: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradiente);
            color: var(--texto);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: 0.5s;
        }

        .contenedor { max-width: 600px; width: 100%; text-align: center; }

        header { margin: 60px 0 30px; }

        .tarjeta {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 2px solid var(--accent);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .menu-juegos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-juego {
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-juego:hover { background: var(--accent); transform: scale(1.05); }

        /* Pantalla de juego */
        #pantalla-juego { display: none; }
        .expresion { font-size: 2.5rem; font-weight: bold; margin: 20px 0; color: #ff9f43; }
        
        .input-respuesta { 
            padding: 12px; 
            border-radius: 10px; 
            border: none; 
            width: 80%; 
            font-size: 1.2rem; 
            text-align: center; 
            margin-bottom: 10px; 
            outline: none;
        }
        
        /* Estilos de botones de acción */
        .btn-accion {
            padding: 15px;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        #btn-comprobar { background: #2ed573; }
        #btn-comprobar:hover { background: #26af5f; }

        #btn-sig { 
            background: var(--accent); 
            display: none; 
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-nav {
            position: fixed; top: 20px; padding: 10px 15px;
            border-radius: 10px; border: none; background: rgba(255,255,255,0.2);
            color: white; cursor: pointer; text-decoration: none; font-weight: bold; z-index: 100;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-nav" style="left: 20px;">🏠 Inicio</a>
    <button class="btn-nav" style="right: 20px;" onclick="toggleDarkMode()">🌓</button>

    <div class="contenedor">
        <header>
            <h1>🎮 Centro de Juegos</h1>
            <p id="subtitulo">Elige tu desafío matemático</p>
        </header>

        <div id="menu" class="tarjeta">
            <div class="menu-juegos">
                <button class="btn-juego" onclick="empezarJuego('basico')">➕➖✖️➗<br>Básico</button>
                <button class="btn-juego" onclick="empezarJuego('algebra')">🧬<br>Álgebra (x)</button>
                <button class="btn-juego" onclick="empezarJuego('polinomio')">🏷️<br>Polinomios</button>
                <button class="btn-juego" onclick="location.reload()">🔄<br>Reiniciar</button>
            </div>
        </div>

        <div id="pantalla-juego" class="tarjeta">
            <h2 id="tipo-titulo">Juego</h2>
            <div class="expresion" id="pregunta"></div>
            
            <div id="controles-respuesta">
                <input type="text" id="respuesta" class="input-respuesta" placeholder="Tu respuesta...">
                <button id="btn-comprobar" class="btn-accion" onclick="verificar()">Comprobar ✅</button>
            </div>

            <div id="botones-clasificacion" style="display:none;" class="menu-juegos">
                <button class="btn-juego" onclick="verificar('monomio')">Monomio</button>
                <button class="btn-juego" onclick="verificar('binomio')">Binomio</button>
                <button class="btn-juego" onclick="verificar('trinomio')">Trinomio</button>
            </div>

            <p id="feedback" style="margin-top: 20px; font-weight: bold; min-height: 24px;"></p>
            <p style="font-size: 1.2rem;">Puntaje: <span id="puntos">0</span></p>
            
            <button id="btn-sig" class="btn-accion" onclick="siguiente()">Siguiente ➡️</button>
        </div>
    </div>

    <script>
        let modo = "";
        let puntos = parseInt(localStorage.getItem('puntosCentro')) || 0;
        let respuestaCorrecta = "";

        function empezarJuego(tipo) {
            modo = tipo;
            document.getElementById('menu').style.display = "none";
            document.getElementById('pantalla-juego').style.display = "block";
            document.getElementById('tipo-titulo').innerText = "Desafío " + tipo.toUpperCase();
            document.getElementById('puntos').innerText = puntos;
            
            const esPolinomio = (tipo === 'polinomio');
            document.getElementById('controles-respuesta').style.display = esPolinomio ? "none" : "block";
            document.getElementById('botones-clasificacion').style.display = esPolinomio ? "grid" : "none";
            
            generar();
        }

        function generar() {
            document.getElementById('btn-sig').style.display = "none";
            document.getElementById('feedback').innerText = "";
            document.getElementById('respuesta').value = "";
            document.getElementById('respuesta').disabled = false;
            document.getElementById('btn-comprobar').style.display = (modo === 'polinomio') ? "none" : "block";
            
            let q = "";
            if (modo === 'basico') {
                const n1 = Math.floor(Math.random() * 10) + 2;
                const n2 = Math.floor(Math.random() * 10) + 2;
                q = `${n1} x ${n2}`;
                respuestaCorrecta = n1 * n2;
            } else if (modo === 'algebra') {
                const x = Math.floor(Math.random() * 10) + 1;
                const a = Math.floor(Math.random() * 10) + 1;
                q = `x + ${a} = ${x + a}`;
                respuestaCorrecta = x;
            } else if (modo === 'polinomio') {
                const tipos = ['monomio', 'binomio', 'trinomio'];
                respuestaCorrecta = tipos[Math.floor(Math.random() * 3)];
                if(respuestaCorrecta === 'monomio') q = "4x²";
                if(respuestaCorrecta === 'binomio') q = "2x + 5";
                if(respuestaCorrecta === 'trinomio') q = "x² + 3x - 2";
            }
            document.getElementById('pregunta').innerText = q;
        }

        function verificar(resBoton) {
            const input = document.getElementById('respuesta');
            const resUser = (resBoton || input.value).toString().trim().toLowerCase();
            const f = document.getElementById('feedback');

            if (resUser == respuestaCorrecta.toString().toLowerCase()) {
                f.innerText = "✅ ¡Correcto!"; f.style.color = "#2ed573";
                puntos += 10;
                localStorage.setItem('puntosCentro', puntos);
            } else {
                f.innerText = "❌ Era: " + respuestaCorrecta; f.style.color = "#ff4757";
            }
            
            document.getElementById('puntos').innerText = puntos;
            document.getElementById('btn-sig').style.display = "block";
            document.getElementById('btn-comprobar').style.display = "none";
            input.disabled = true;
        }

        function siguiente() { generar(); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        window.onload = () => { document.getElementById('puntos').innerText = puntos; };
    </script>
</body>
                    </html>
