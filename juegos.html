<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Matemáticos | Criss Creator</title>
    <style>
        :root {
            --bg-gradiente: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-card: rgba(255, 255, 255, 0.1);
            --texto: white;
            --accent: #00d2ff;
        }

        .dark-mode {
            --bg-gradiente: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-card: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradiente);
            color: var(--texto);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: 0.5s;
        }

        .contenedor { max-width: 600px; width: 100%; text-align: center; }

        header { margin: 60px 0 30px; }

        .tarjeta {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 2px solid var(--accent);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .menu-juegos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-juego {
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-juego:hover { background: var(--accent); transform: scale(1.05); }

        /* Estilos del juego activo */
        #pantalla-juego { display: none; }
        .expresion { font-size: 2.5rem; font-weight: bold; margin: 20px 0; color: #ff9f43; }
        .input-respuesta { padding: 12px; border-radius: 10px; border: none; width: 80%; font-size: 1.2rem; text-align: center; margin-bottom: 10px; }
        
        .btn-nav {
            position: fixed; top: 20px; padding: 10px 15px;
            border-radius: 10px; border: none; background: rgba(255,255,255,0.2);
            color: white; cursor: pointer; text-decoration: none; font-weight: bold; z-index: 100;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-nav" style="left: 20px;">🏠 Inicio</a>
    <button class="btn-nav" style="right: 20px;" onclick="toggleDarkMode()">🌓</button>

    <div class="contenedor">
        <header>
            <h1>🎮 Centro de Juegos</h1>
            <p id="subtitulo">Elige tu desafío matemático</p>
        </header>

        <!-- MENÚ DE SELECCIÓN -->
        <div id="menu" class="tarjeta">
            <div class="menu-juegos">
                <button class="btn-juego" onclick="empezarJuego('basico')">➕➖✖️➗<br>Básico</button>
                <button class="btn-juego" onclick="empezarJuego('algebra')">🧬<br>Álgebra (x)</button>
                <button class="btn-juego" onclick="empezarJuego('polinomio')">🏷️<br>Polinomios</button>
                <button class="btn-juego" onclick="location.reload()">🔄<br>Reiniciar</button>
            </div>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="pantalla-juego" class="tarjeta">
            <h2 id="tipo-titulo">Juego</h2>
            <div class="expresion" id="pregunta"></div>
            
            <div id="controles-respuesta">
                <input type="text" id="respuesta" class="input-respuesta" placeholder="Tu respuesta...">
                <br>
                <button onclick="verificar()" style="background: #2ed573; width: 100%; padding: 15px;">Comprobar ✅</button>
            </div>

            <div id="botones-clasificacion" style="display:none;" class="menu-juegos">
                <button class="btn-juego" onclick="verificar('monomio')">Monomio</button>
                <button class="btn-juego" onclick="verificar('binomio')">Binomio</button>
                <button class="btn-juego" onclick="verificar('trinomio')">Trinomio</button>
            </div>

            <p id="feedback" style="margin-top: 20px; font-weight: bold;"></p>
            <p>Puntaje: <span id="puntos">0</span></p>
            <button id="btn-sig" onclick="siguiente()" style="display:none; background: var(--accent); width: 100%;">Siguiente ➡️</button>
        </div>
    </div>

    <script>
        let modo = "";
        let indice = 0;
        let puntos = 0;
        let listaPreguntas = [];

        const bancos = {
            basico: [
                { q: "12 + 15", a: "27" }, { q: "50 - 18", a: "32" }, { q: "7 x 8", a: "56" }, { q: "100 / 4", a: "25" }
            ],
            algebra: [
                { q: "x + 5 = 12", a: "7" }, { q: "2x = 20", a: "10" }, { q: "x - 10 = 5", a: "15" }, { q: "x / 2 = 8", a: "16" }
            ],
            polinomio: [
                { q: "5x²", a: "Monomio" }, { q: "x + y", a: "Binomio" }, { q: "x² + 2x + 1", a: "Trinomio" }, { q: "3a", a: "Monomio" }
            ]
        };

        function empezarJuego(tipo) {
            modo = tipo;
            listaPreguntas = bancos[tipo];
            indice = 0;
            document.getElementById('menu').style.display = "none";
            document.getElementById('pantalla-juego').style.display = "block";
            document.getElementById('tipo-titulo').innerText = "Desafío " + tipo.toUpperCase();
            
            // Configurar si es con input o con botones
            if(tipo === 'polinomio') {
                document.getElementById('controles-respuesta').style.display = "none";
                document.getElementById('botones-clasificacion').style.display = "grid";
            } else {
                document.getElementById('controles-respuesta').style.display = "block";
                document.getElementById('botones-clasificacion').style.display = "none";
            }
            cargar();
        }

        function cargar() {
            document.getElementById('btn-sig').style.display = "none";
            document.getElementById('feedback').innerText = "";
            document.getElementById('respuesta').value = "";
            document.getElementById('pregunta').innerText = listaPreguntas[indice].q;
        }

        function verificar(resBoton) {
            const resUser = resBoton || document.getElementById('respuesta').value.trim().toLowerCase();
            const correcta = listaPreguntas[indice].a.toLowerCase();
            const f = document.getElementById('feedback');

            if (resUser == correcta) {
                f.innerText = "✅ ¡Excelente!"; f.style.color = "#2ed573";
                puntos += 10;
            } else {
                f.innerText = "❌ Incorrecto, era: " + correcta; f.style.color = "#ff4757";
            }
            document.getElementById('puntos').innerText = puntos;
            document.getElementById('btn-sig').style.display = "block";
        }

        function siguiente() {
            indice++;
            if (indice < listaPreguntas.length) { cargar(); } 
            else {
                document.getElementById('pantalla-juego').innerHTML = `<h2>🏆 ¡Fin del Juego!</h2><p>Puntaje: ${puntos}</p><button onclick="location.reload()">Volver al Menú</button>`;
            }
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
    </script>
</body>
</html>
